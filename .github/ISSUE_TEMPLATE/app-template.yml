name: App Catalog Template
description: Submit a new app template for the Orca App Catalog
title: "[Template] "
labels: ["template"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a template! Fill in the details below and we'll add it to the community catalog.

        **Two types of templates:**
        - **Single container** — one Docker image with ports, env vars, and volumes
        - **Compose stack** — a full docker-compose.yml with multiple services (e.g., WordPress + MySQL)

  - type: input
    id: name
    attributes:
      label: App Name
      placeholder: e.g., Traefik
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: One or two sentences about what this app does.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Database
        - Web Server
        - Monitoring
        - Tools
        - AI
        - Development
        - Message Queue
        - Search
        - Storage
        - Analytics
        - Automation
        - Other
    validations:
      required: true

  - type: dropdown
    id: template_type
    attributes:
      label: Template Type
      description: Single container or multi-service compose stack?
      options:
        - Single Container
        - Compose Stack (docker-compose.yml)
      default: 0
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Docker Image (single container only)
      description: "Leave empty for compose stacks"
      placeholder: e.g., traefik:v3

  - type: input
    id: ports
    attributes:
      label: Port Mappings (single container only)
      description: "Comma-separated host:container pairs. For compose stacks, define ports in the YAML."
      placeholder: "8080:80, 443:443"

  - type: textarea
    id: env
    attributes:
      label: Environment Variables (single container only)
      description: "One per line, KEY=value format. Use 'changeme' for passwords (auto-generated at deploy). For compose stacks, define env in the YAML."
      placeholder: |
        ADMIN_PASSWORD=changeme
        DATABASE_URL=postgres://localhost/mydb

  - type: input
    id: volumes
    attributes:
      label: Volumes (single container only)
      description: "Comma-separated volume:path pairs. For compose stacks, define volumes in the YAML."
      placeholder: "appdata:/data, config:/etc/app"

  - type: textarea
    id: compose_yaml
    attributes:
      label: Docker Compose YAML (compose stacks only)
      description: "Paste the full docker-compose.yml content. Use 'changeme' for passwords — Orca auto-generates unique values at deploy time. The YAML is saved to ~/.config/orca/stacks/<template-id>/ and can be edited later."
      placeholder: |
        version: '3.8'
        services:
          app:
            image: myapp:latest
            ports:
              - '8080:80'
            environment:
              DB_PASSWORD: changeme
            depends_on:
              - db
          db:
            image: postgres:16-alpine
            environment:
              POSTGRES_PASSWORD: changeme
            volumes:
              - db-data:/var/lib/postgresql/data
        volumes:
          db-data:
      render: yaml

  - type: dropdown
    id: restart_policy
    attributes:
      label: Restart Policy (single container only)
      options:
        - unless-stopped
        - always
        - "no"
      default: 0

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: How to access the app, first-run instructions, tips.
      placeholder: "Access at http://localhost:8080. Default login: admin/changeme"
    validations:
      required: true
