name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Rust workspace check + clippy — excludes Tauri GUI crate (needs system deps)
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Check workspace (excluding Tauri GUI)
        run: cargo check --workspace --exclude orca-gui

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude orca-gui

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --exclude orca-gui -- -D warnings

      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  # Frontend type check, lint, and build
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install and build
        working-directory: gui
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npx vite build
