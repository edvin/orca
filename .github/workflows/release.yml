name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Orca v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft

  build-and-upload:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-release-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build frontend
        working-directory: gui
        run: npx vite build

      - name: Build daemon binary
        run: cargo build --release --bin orca-daemon --target ${{ matrix.platform.target }}

      - name: Copy daemon to sidecar location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.platform.target }}/release/orca-daemon.exe "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}.exe"
          else
            cp target/${{ matrix.platform.target }}/release/orca-daemon "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}"
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build Tauri app (macOS signed)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Edvin Syse (T4R2B5AWVQ)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: "T4R2B5AWVQ"
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.platform.target }}

      - name: Build Tauri app (Linux/Windows)
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --target ${{ matrix.platform.target }}

      - name: Cleanup keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Move sig files before signing
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\sigs" | Out-Null
          Get-ChildItem -Path "target\${{ matrix.platform.target }}\release\bundle" -Recurse -Filter "*.sig" | Move-Item -Destination "$env:RUNNER_TEMP\sigs\" -Force

      - name: Sign Windows installers
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          # Download and set up CodeSignTool manually with production endpoints
          $cstVersion = "v1.3.0"
          $cstDir = "$env:RUNNER_TEMP\CodeSignTool"
          New-Item -ItemType Directory -Force -Path $cstDir | Out-Null

          # Download CodeSignTool
          $zipUrl = "https://github.com/SSLcom/CodeSignTool/releases/download/$cstVersion/CodeSignTool-$cstVersion-windows.zip"
          $zipPath = "$env:RUNNER_TEMP\CodeSignTool.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $cstDir -Force

          $cstPath = "$cstDir\CodeSignTool-$cstVersion"

          # Write PRODUCTION config (not sandbox!)
          @"
          CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8
          OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token
          CSC_API_ENDPOINT=https://cs.ssl.com
          TSA_URL=http://ts.ssl.com
          TSA_LEGACY_URL=http://ts.ssl.com/legacy
          "@ | Set-Content -Path "$cstPath\conf\code_sign_tool.properties"

          # Set up Java
          $javaHome = "$cstPath\jdk-11.0.2"
          if (-not (Test-Path $javaHome)) {
            # Use the system Java
            $javaHome = $env:JAVA_HOME
          }

          # Sign each installer
          foreach ($dir in @("nsis", "msi")) {
            $bundleDir = "target\${{ matrix.platform.target }}\release\bundle\$dir"
            if (Test-Path $bundleDir) {
              Get-ChildItem -Path $bundleDir -File | Where-Object { $_.Extension -in @('.exe', '.msi') } | ForEach-Object {
                Write-Host "Signing $($_.Name)..."
                & "$javaHome\bin\java" -jar "$cstPath\jar\code_sign_tool-1.3.0.jar" sign `
                  -username="${{ secrets.SSLCOM_USERNAME }}" `
                  -password="${{ secrets.SSLCOM_PASSWORD }}" `
                  -credential_id="${{ secrets.SSLCOM_CREDENTIAL_ID }}" `
                  -totp_secret="${{ secrets.SSLCOM_TOTP_SECRET }}" `
                  -input_file_path="$($_.FullName)" `
                  -override=true
                if ($LASTEXITCODE -ne 0) { Write-Host "Warning: signing $($_.Name) failed" }
              }
            }
          }

      - name: Restore sig files after signing
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:RUNNER_TEMP\sigs" -Filter "*.sig" | ForEach-Object {
            $name = $_.Name
            foreach ($dir in @("nsis", "msi")) {
              $dest = "target\${{ matrix.platform.target }}\release\bundle\$dir"
              if (Test-Path $dest) { Copy-Item $_.FullName -Destination "$dest\$name" -Force }
            }
          }

      - name: Upload release artifacts
        shell: bash
        run: |
          TARGET="target/${{ matrix.platform.target }}/release"
          UPLOAD_FILES=""

          # Find bundle artifacts
          if [ -d "$TARGET/bundle" ]; then
            while IFS= read -r f; do
              UPLOAD_FILES="$UPLOAD_FILES \"$f\""
            done < <(find "$TARGET/bundle" -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" -o -name "*.sig" -o -name "*latest.json" -o -name "*-setup.exe" \) 2>/dev/null)
          fi

          # Standalone daemon binaries are uploaded by the daemon-package workflow
          # — don't duplicate them here to avoid name collisions

          if [ -n "$UPLOAD_FILES" ]; then
            echo "Uploading artifacts..."
            eval gh release upload "${{ github.ref_name }}" $UPLOAD_FILES --repo "${{ github.repository }}" --clobber
          else
            echo "No artifacts found"
          fi

  publish-release:
    name: Publish Release
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
