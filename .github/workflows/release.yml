name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Orca v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft

  build-and-upload:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-release-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build frontend
        working-directory: gui
        run: npx vite build

      - name: Build daemon binary
        run: cargo build --release --bin orca-daemon --target ${{ matrix.platform.target }}

      - name: Copy daemon to sidecar location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.platform.target }}/release/orca-daemon.exe "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}.exe"
          else
            cp target/${{ matrix.platform.target }}/release/orca-daemon "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}"
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build Tauri app (macOS signed)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Edvin Syse (T4R2B5AWVQ)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: "T4R2B5AWVQ"
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.platform.target }}

      - name: Build Tauri app (Linux/Windows)
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --target ${{ matrix.platform.target }}

      - name: Cleanup keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Sign Windows installers
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          SSLCOM_USERNAME: ${{ secrets.SSLCOM_USERNAME }}
          SSLCOM_PASSWORD: ${{ secrets.SSLCOM_PASSWORD }}
          SSLCOM_CREDENTIAL_ID: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          SSLCOM_TOTP_SECRET: ${{ secrets.SSLCOM_TOTP_SECRET }}
        run: |
          # Download CodeSignTool
          CST_DIR="$RUNNER_TEMP/cst"
          mkdir -p "$CST_DIR"
          curl -fsSL "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0.zip" -o "$CST_DIR/cst.zip"
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$CST_DIR/cst.zip" "$CST_DIR"
          CST_JAR="$CST_DIR/jar/code_sign_tool-1.3.0.jar"

          # Debug: show paths and find files
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          BUNDLE_BASE="target/${{ matrix.platform.target }}/release/bundle"
          echo "Looking for installers..."
          find "$BUNDLE_BASE" -type f \( -name "*.exe" -o -name "*.msi" \) 2>/dev/null || echo "No installers found via find"

          # Sign each .exe and .msi
          find "$BUNDLE_BASE" -type f \( -name "*.exe" -o -name "*.msi" \) | while read -r file; do
            echo "=== Signing: $file ==="
            # Generate OTP
            OTP=$(python -c "
          import hmac,hashlib,struct,time,base64
          s='$SSLCOM_TOTP_SECRET'
          s+='='*(8-len(s)%8) if len(s)%8 else ''
          k=base64.b32decode(s,True)
          c=int(time.time())//30
          h=hmac.new(k,struct.pack('>Q',c),hashlib.sha1).digest()
          o=h[-1]&0xF
          print(f'{(struct.unpack(\">I\",h[o:o+4])[0]&0x7FFFFFFF)%1000000:06d}')
          " 2>/dev/null || python3 -c "
          import hmac,hashlib,struct,time,base64
          s='$SSLCOM_TOTP_SECRET'
          s+='='*(8-len(s)%8) if len(s)%8 else ''
          k=base64.b32decode(s,True)
          c=int(time.time())//30
          h=hmac.new(k,struct.pack('>Q',c),hashlib.sha1).digest()
          o=h[-1]&0xF
          print(f'{(struct.unpack(\">I\",h[o:o+4])[0]&0x7FFFFFFF)%1000000:06d}')
          ")
            echo "Generated OTP: ${OTP:0:2}****"
            # Run from CodeSignTool dir so it finds conf/code_sign_tool.properties
            ABSOLUTE_FILE="$(cd "$GITHUB_WORKSPACE" && pwd)/$file"
            (cd "$CST_DIR" && echo "$OTP" | java -jar jar/code_sign_tool-1.3.0.jar sign \
              -username="$SSLCOM_USERNAME" \
              -password="$SSLCOM_PASSWORD" \
              -credential_id="$SSLCOM_CREDENTIAL_ID" \
              -input_file_path="$(cygpath -w "$ABSOLUTE_FILE" 2>/dev/null || echo "$ABSOLUTE_FILE")" \
              -override=true) && echo "=== Signed successfully ===" || echo "=== WARNING: Signing failed ==="
            sleep 5
          done

      - name: Upload release artifacts
        shell: bash
        run: |
          TARGET="target/${{ matrix.platform.target }}/release"
          UPLOAD_FILES=""

          # Find bundle artifacts
          if [ -d "$TARGET/bundle" ]; then
            while IFS= read -r f; do
              UPLOAD_FILES="$UPLOAD_FILES \"$f\""
            done < <(find "$TARGET/bundle" -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" -o -name "*.sig" -o -name "*latest.json" -o -name "*-setup.exe" \) 2>/dev/null)
          fi

          # Standalone daemon binaries are uploaded by the daemon-package workflow
          # — don't duplicate them here to avoid name collisions

          if [ -n "$UPLOAD_FILES" ]; then
            echo "Uploading artifacts..."
            eval gh release upload "${{ github.ref_name }}" $UPLOAD_FILES --repo "${{ github.repository }}" --clobber
          else
            echo "No artifacts found"
          fi

  publish-release:
    name: Publish Release
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
