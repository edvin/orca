name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Orca v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft

  build-and-upload:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-release-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build frontend
        working-directory: gui
        run: npx vite build

      - name: Build daemon binary
        run: cargo build --release --bin orca-daemon --target ${{ matrix.platform.target }}

      - name: Copy daemon to sidecar location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.platform.target }}/release/orca-daemon.exe "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}.exe"
          else
            cp target/${{ matrix.platform.target }}/release/orca-daemon "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}"
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo tauri build --target ${{ matrix.platform.target }}

      - name: Upload release artifacts
        shell: bash
        run: |
          TARGET="target/${{ matrix.platform.target }}/release"
          UPLOAD_FILES=""

          # Find bundle artifacts
          if [ -d "$TARGET/bundle" ]; then
            while IFS= read -r f; do
              UPLOAD_FILES="$UPLOAD_FILES \"$f\""
            done < <(find "$TARGET/bundle" -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" -o -name "*.sig" -o -name "*latest.json" -o -name "*-setup.exe" \) 2>/dev/null)
          fi

          # Add standalone daemon binary
          if [ -f "$TARGET/orca-daemon.exe" ]; then
            UPLOAD_FILES="$UPLOAD_FILES \"$TARGET/orca-daemon.exe\""
          elif [ -f "$TARGET/orca-daemon" ]; then
            UPLOAD_FILES="$UPLOAD_FILES \"$TARGET/orca-daemon\""
          fi

          if [ -n "$UPLOAD_FILES" ]; then
            echo "Uploading artifacts..."
            eval gh release upload "${{ github.ref_name }}" $UPLOAD_FILES --repo "${{ github.repository }}" --clobber
          else
            echo "No artifacts found"
          fi

  publish-release:
    name: Publish Release
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
