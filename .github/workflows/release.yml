name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: Orca v${{ steps.version.outputs.version }}

  build-and-upload:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-release-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build frontend
        working-directory: gui
        run: npx vite build

      - name: Build daemon binary
        run: cargo build --release --bin orca-daemon --target ${{ matrix.platform.target }}

      - name: Copy daemon to sidecar location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.platform.target }}/release/orca-daemon.exe "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}.exe"
          else
            cp target/${{ matrix.platform.target }}/release/orca-daemon "src-tauri/binaries/orca-daemon-${{ matrix.platform.target }}"
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLE_SIGNING_IDENTITY: ""
        run: cargo tauri build --target ${{ matrix.platform.target }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/${{ matrix.platform.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.platform.target }}/release/bundle/**/*.deb
            target/${{ matrix.platform.target }}/release/bundle/**/*.dmg
            target/${{ matrix.platform.target }}/release/bundle/**/*.exe
            target/${{ matrix.platform.target }}/release/bundle/**/*.msi
            target/${{ matrix.platform.target }}/release/bundle/**/*.sig
            target/${{ matrix.platform.target }}/release/bundle/**/*latest.json

      - name: Upload standalone daemon
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/${{ matrix.platform.target }}/release/orca-daemon
            target/${{ matrix.platform.target }}/release/orca-daemon.exe

  publish-release:
    name: Publish Release
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
