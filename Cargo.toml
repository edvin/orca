[workspace]
resolver = "2"
members = [
    "crates/orca-core",
    "crates/orca-backend-common",
    "crates/orca-backend-native",
    "crates/orca-backend-macos",
    "crates/orca-backend-windows",
    "crates/orca-daemon",
    "crates/orca-cli",
    "src-tauri",
]

[workspace.package]
version = "0.29.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edvin/orca"

[workspace.dependencies]
orca-core = { path = "crates/orca-core" }
orca-backend-common = { path = "crates/orca-backend-common" }
orca-backend-native = { path = "crates/orca-backend-native" }
tokio-stream = "0.1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
trait-variant = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

[workspace.lints.clippy]
needless_return = "warn"
redundant_closure = "warn"
manual_map = "warn"
single_match = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
uninlined_format_args = "warn"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
