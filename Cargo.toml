[workspace]
resolver = "2"
members = [
    "crates/vessel-core",
    "crates/vessel-backend-native",
    "crates/vessel-daemon",
    "crates/vessel-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TODO/vessel"

[workspace.dependencies]
vessel-core = { path = "crates/vessel-core" }
vessel-backend-native = { path = "crates/vessel-backend-native" }
tokio-stream = "0.1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
dirs = "6"
trait-variant = "0.1"
