<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6feb"/>
      <stop offset="100%" style="stop-color:#0d4dab"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Orca body - stylized whale/orca shape -->
  <!-- Main body -->
  <ellipse cx="260" cy="270" rx="160" ry="100" fill="#f0f6fc"/>
  <!-- Dorsal fin -->
  <path d="M240 170 Q255 100 280 170" fill="#f0f6fc"/>
  <!-- Tail -->
  <path d="M100 260 Q60 220 80 190 Q95 230 110 250Z" fill="#f0f6fc"/>
  <path d="M100 280 Q60 320 80 350 Q95 310 110 290Z" fill="#f0f6fc"/>
  <!-- Dark patch (orca marking) -->
  <ellipse cx="290" cy="260" rx="100" ry="65" fill="#161b22"/>
  <!-- Eye -->
  <ellipse cx="340" cy="245" rx="14" ry="16" fill="#f0f6fc"/>
  <ellipse cx="342" cy="243" rx="6" ry="7" fill="#161b22"/>
  <!-- Eye patch (orca white marking) -->
  <ellipse cx="355" cy="260" rx="20" ry="8" fill="#f0f6fc" transform="rotate(-15 355 260)"/>
  <!-- Belly -->
  <ellipse cx="250" cy="310" rx="120" ry="40" fill="#e6edf3"/>
  <!-- Container blocks on the back (docker/container reference) -->
  <rect x="200" y="195" width="28" height="22" rx="3" fill="#58a6ff" opacity="0.9"/>
  <rect x="233" y="195" width="28" height="22" rx="3" fill="#3fb950" opacity="0.9"/>
  <rect x="266" y="195" width="28" height="22" rx="3" fill="#d29922" opacity="0.9"/>
  <rect x="216" y="175" width="28" height="22" rx="3" fill="#f85149" opacity="0.85"/>
  <rect x="249" y="175" width="28" height="22" rx="3" fill="#58a6ff" opacity="0.85"/>
</svg>
