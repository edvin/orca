# The demo company's workspace, for Orca's showcase video (video/README.md).
# Every app is a real open-source project, so everything on screen runs.
name: acme
description: Everything you need to work on Acme's apps.

network: acme

gateway:
  domain: acme.localhost
  title: Acme dev
  logo: icons/acme-logo.svg

shared:
  compose: compose.yaml
  name: acme-shared

routes:
  - { hostname: mail, target: "mailpit:8025", title: Mailpit, description: Every email our apps send }
  - { hostname: grafana, target: "grafana:3000", title: Grafana, description: Dashboards and alerts }
  - { hostname: db, target: "adminer:8080", title: Adminer, description: Look inside any database }

clone_into: ~/code/acme

# One MariaDB and one Postgres for every app: a project whose orca.yaml
# requires a database gets one of its own on the matching server.
databases:
  mariadb: { engine: mariadb, service: mariadb }
  postgres: { engine: postgres, service: postgres }

projects:
  website:
    group: Marketing
    repo: https://git.acme.dev/acme/website.git
    description: The marketing site, on WordPress
    icon: wordpress
    links:
      - { name: Website, Staging: "https://staging.acme.example", Production: "https://acme.example" }
  analytics:
    group: Marketing
    repo: https://git.acme.dev/acme/analytics.git
    description: Privacy-friendly web analytics (Umami)
    icon: icons/umami.svg
    links:
      - { name: Analytics, Production: "https://analytics.acme.example" }
  git:
    group: Engineering
    repo: https://git.acme.dev/acme/git.git
    description: Our own Git server (Gitea)
    icon: gitea
    links:
      - { name: Git, Production: "https://git.acme.example" }
  automations:
    group: Engineering
    repo: https://git.acme.dev/acme/automations.git
    description: Workflows and integrations (n8n)
    icon: n8n
    uses: [mailpit]
  status:
    group: Engineering
    repo: https://git.acme.dev/acme/status.git
    description: Uptime monitoring and status pages (Uptime Kuma)
    icon: icons/uptime-kuma.svg
    links:
      - { name: Status page, Production: "https://status.acme.example" }
  notes:
    group: Team tools
    repo: https://git.acme.dev/acme/notes.git
    description: The team's notes (Memos)
    icon: icons/memos.svg
  whiteboard:
    group: Team tools
    repo: https://git.acme.dev/acme/whiteboard.git
    description: A shared whiteboard (Excalidraw)
    icon: icons/excalidraw.svg
  passwords:
    group: Team tools
    repo: https://git.acme.dev/acme/passwords.git
    description: The team's password vault (Vaultwarden)
    icon: icons/vaultwarden.svg
  files:
    group: Team tools
    repo: https://git.acme.dev/acme/files.git
    description: Shared files (File Browser)
    icon: icons/filebrowser.svg
